# Šablona TBDB: zveřejnění statického webu přes GitHub Pages
# Zkopírovat do repozitáře webu jako .github/workflows/nasadit.yml.
# Pages musí být nastavené na nasazení přes Actions (Settings → Pages → Source: GitHub Actions).
#
# Co dělá po každém push do main:
#   1. zkontroluje celou historii na tajné údaje (gitleaks) – když najde, nic se nezveřejní,
#   2. zabalí a nahraje obsah složky WEB (výchozí: kořen repozitáře),
#   3. v samostatné navazující úloze ho zveřejní a ověří, že živý web vrací přesně nahraný
#      soubor KONTROLNI_SOUBOR.
# Zabalení a zveřejnění jsou dvě úlohy záměrně: když deploy-pages běží ve stejné úloze hned
# po nahrání, GitHub balíček občas ještě nevidí („No artifacts named github-pages“, 25. 11. 2026).

name: Nasadit web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  WEB: web           # složka, která se zveřejní
  KONTROLNI_SOUBOR: index.html # soubor, podle kterého se ověří živý web

jobs:
  zabalit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kontrola tajných údajů
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --redact --verbose --no-banner

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.WEB }}

  nasadit:
    needs: zabalit
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.nasazeni.outputs.page_url }}
    steps:
      - id: nasazeni
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4

      - name: Ověřit živý web
        env:
          URL: ${{ steps.nasazeni.outputs.page_url }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${URL}${KONTROLNI_SOUBOR}?cb=${GITHUB_SHA}" -o zivy.html && \
               cmp -s zivy.html "${WEB}/${KONTROLNI_SOUBOR}"; then
              echo "Web běží s verzí ${GITHUB_SHA::7}: ${URL}"; exit 0
            fi
            sleep 10
          done
          echo "Živý web se do 5 minut neshoduje s nahranou verzí: ${URL}"; exit 1
