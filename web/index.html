<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kabinet holičů – rezervace křesel</title>
<style>
:root{--b:#1F4E78;--li:#d5dfe8;--se:#5a6b7a}
*{box-sizing:border-box}
body{margin:0;background:#f4f7fa;color:#1a1a1a;font:15px/1.55 Verdana,Geneva,sans-serif}
header{background:var(--b);color:#fff;padding:18px 16px}
header h1{margin:0 auto;font-size:19px;max-width:640px}
header p{margin:4px auto 0;font-size:13px;opacity:.85;max-width:640px}
main{max-width:640px;margin:0 auto;padding:16px}
.karta{background:#fff;border:1px solid var(--li);border-radius:8px;padding:14px 16px}
.mala{font-size:12.5px;color:var(--se)}
</style>
</head>
<body>
<header><h1>Kabinet holičů – rezervace křesel</h1>
<p>Prototyp aplikace</p></header>
<main>
<div class="karta">
<p>Tady bude prototyp aplikace pro rezervaci křesel. Zatím ho připravujeme.</p>
<p class="mala">TBDB Consulting</p>
</div>
</main>
</body>
</html>
